```html
<!DOCTYPE html>
<html>
<head>
    <title>My A-Frame VR Scene</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>

<body>

    <a-scene>

        <a-box 
            position="0 1 -3" 
            rotation="0 45 0" 
            color="red">
        </a-box>

        <a-sphere 
            position="2 1 -3" 
            radius="1" 
            color="blue">
        </a-sphere>

        <a-plane 
            position="0 0 -4" 
            rotation="-90 0 0" 
            width="10" 
            height="10" 
            color="green">
        </a-plane>

        <a-sky color="lightblue"></a-sky>

        <a-camera position="0 1.6 0"></a-camera>

    </a-scene>

</body>
</html>
